<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RefBase</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav>
    <a href="/"><strong>RefBase</strong></a>
    <a href="/upload">Add paper</a>
    <a href="/projects">Projects</a>
    <form action="/search" method="get" class="searchbox">
      <input type="search" name="q" placeholder="Search titles, abstracts &amp; PDFs&hellip;"
             value="{{ request.query_params.get('q', '') }}">
      <button type="submit">Search</button>
    </form>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/export.js" defer></script>
</body>
</html>
